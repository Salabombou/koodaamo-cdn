[global]
    server string = samba
    server role = standalone server
    security = user
    server min protocol = SMB2
    map to guest = Never
    # Explicit IP/mask avoids Samba skipping WireGuard's non-broadcast interface.
    interfaces = lo 10.13.13.1/24
    bind interfaces only = yes
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    host msdfs = no
    wide links = no
    follow symlinks = no
    ea support = yes
    vfs objects = catia fruit streams_xattr
    fruit:resource = file
    fruit:metadata = stream
    fruit:locking = netatalk
    fruit:encoding = native
    fruit:aapl = yes
    mangled names = no
    dos charset = CP850
    unix charset = UTF-8

[Koodaamo CDN]
    path = /shared
    browseable = yes
    writable = yes
    read only = no
    guest ok = no
    create mask = 0660
    force create mode = 0640
    directory mask = 0770
    force directory mode = 0750
