server {
    listen 8080;
    server_name _;

    root /shared;
    autoindex on;
    disable_symlinks on;
    absolute_redirect off;

    location ~ /\. {
        autoindex off;
        limit_except GET HEAD {
            deny all;
        }
        if (-d $request_filename) {
            return 404;
        }
        try_files $uri =404;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
