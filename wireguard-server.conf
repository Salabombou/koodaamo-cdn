[Interface]
Address = ${INTERFACE}.1
ListenPort = 51820
PrivateKey = $(cat /config/server/privatekey-server)
# No NAT or VPN forwarding: only SMB in this network namespace is reachable.
PostUp = iptables -N WG_SMB; iptables -A WG_SMB -p tcp --dport 445 -j ACCEPT; iptables -A WG_SMB -j DROP; iptables -I INPUT 1 -i eth0 -p tcp --dport 445 -j DROP; iptables -I INPUT 1 -i %i -j WG_SMB; iptables -I FORWARD 1 -i %i -j DROP; iptables -I FORWARD 1 -o %i -j DROP
PostDown = iptables -D INPUT -i %i -j WG_SMB; iptables -D INPUT -i eth0 -p tcp --dport 445 -j DROP; iptables -D FORWARD -i %i -j DROP; iptables -D FORWARD -o %i -j DROP; iptables -F WG_SMB; iptables -X WG_SMB
